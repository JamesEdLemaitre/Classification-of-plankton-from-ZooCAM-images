data:
  trainpath: './data/original_dataset/3-md-4040-2026-challenge/train'
  testpath: './data/original_dataset/3-md-4040-2026-challenge/test'
  batch_size: 256
  num_workers: 8
  valid_ratio: 0.2
  images_resize: 128

optim:
  algo: AdamW
  params:
    lr: 0.001

nepochs: 50
loss: "CrossEntropyLoss"

logging:
  logdir: "./logs"  # Better to provide the fullpath, especially on the cluster
  results_path: "./results"
  model_path: "./logs/VanillaCNNV2_11/best_model.pt"  # Selection du modèle pour l'inférence sur test

scheduler:
  class: "ReduceLROnPlateau"
  mode: "min"        
  factor: 0.7        
  patience: 4
  min_lr: 1.0e-6   


# model:
#   class: Linear
model:
  class: VanillaCNNV2
  layer1_size : 16
  num_layers : 5

training:
  style: standard

phases:
  - name: "full_training"
    epochs: 50
    lr: 0.0001
    unfreeze: "all" 