# Configuration pour logreg_morph_search
# LogReg + réduction de dimension sur TOUTES les features morphologiques
#
# Usage:
#   python -m torchtmpl.main config_logreg_morph.yaml logreg_morph_search

# ── Mode de features ──
features_mode: "morph_only"

# ── Masques de segmentation ──
masks_train_dir: "/home/lmalerba/projects/kaggle_challenge_sdi/kaggle_challenge_sdi/data/original_dataset_optimized_512px_masks/train"
masks_test_dir: "/home/lmalerba/projects/kaggle_challenge_sdi/kaggle_challenge_sdi/data/original_dataset_optimized_512px_masks/test/imgs"

# ── Paramètres de recherche ──
top_k_submit: 5
n_cv_folds: 5

# ── Cache morph features ──
morph_cache_dir: "results/morph_cache"
n_extract_jobs: 8

# ── Échantillonnage : 1000 images/classe, toutes les features ──
max_per_class: 1000

# ── Pas de feature_select_k : on garde TOUTES les features ──
# La réduction de dimension est faite par les pipelines (PCA, tree, MI)
feature_select_k: 0

# ── Grille LogReg ──
logreg_C_values: [0.001, 0.01, 0.05, 0.1, 0.5, 1.0, 5.0, 10.0, 50.0, 100.0]

# ── Réduction de dimension ──
pca_components: [10, 20, 30, 50, 0.90, 0.95, 0.99]
tree_select_k: [15, 30, 50, 80]

data:
  test_path: "/home/lmalerba/projects/kaggle_challenge_sdi/kaggle_challenge_sdi/data/original_dataset_optimized_512px/test/imgs"

logging:
  logdir: "./logs"
