data:
  trainpath: './data/3-md-4040-2026-challenge/train'
  testpath: './data/3-md-4040-2026-challenge/test'
  batch_size: 256
  num_workers: 4
  valid_ratio: 0.2
  images_resize: 128

optim:
  algo: SGD
  params:
    lr: 0.01

nepochs: 20
loss: "CrossEntropyLoss"

logging:
  # wandb: 
  #   project: sample_project
  #   entity: sample_entity
  logdir: "./logs"  # Better to provide the fullpath, especially on the cluster

# model:
#   class: Linear
model:
  class: VanillaCNN
  num_layers : 4
