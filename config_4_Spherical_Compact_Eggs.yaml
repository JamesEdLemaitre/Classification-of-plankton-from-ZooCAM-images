data:
  batch_size: 64
  dataset_size_divider: 1
  images_resize: 224
  num_workers: 8
  testpath: null
  trainpath: ./data/data_reannotated_v2/train/4_Spherical_Compact_Eggs
  transformations_version: basic
  use_rgb: true
  valid_ratio: 0.15
logging:
  logdir: ./logs_v2/specialists_1/4_Spherical_Compact_Eggs
  model_path: ./logs_v2/specialists_1/4_Spherical_Compact_Eggs/best_model.pt
  results_path: ./results
loss: CrossEntropyLoss
model:
  class: DINOv3Classifier_bystep
  dropout: 0.2
  head_hidden_dims:
  - 512
  - 256
  model_size: small
optim:
  algo: AdamW
  params:
    lr: 0.001
phases:
- epochs: 20
  lr: 0.001
  name: training_head
- epochs: 30
  lr: 0.0001
  name: training_last_4_layers
  unfreeze: true
  unfreeze_layers: 4
- epochs: 50
  lr: 1.0e-05
  name: training_full_backbone
  unfreeze: all
scheduler:
  class: ReduceLROnPlateau
  factor: 0.5
  min_lr: 1.0e-06
  mode: min
  patience: 3
training:
  style: specialist
