# ResNeXt50 Multicanal (Orig+CLAHE+Mask) @ 300px with heavier augmentations
data:
  resize: 300
  batch_size: 16
  num_workers: 4
  valid_ratio: 0.2
  training_type: "multicanal"
  original_dataset: "./data/original_dataset_optimized_512px/train"
  clahe_dataset: "./data/original_dataset_optimized_512px_clahe/train"
  masks_dataset: "./data/original_dataset_optimized_512px_masks/train"

model:
  class: "TimmModel"          
  backbone: "resnext50_32x4d"
  pretrained: True            
  freeze_backbone: False

optim:
  algo: "AdamW"
  params:           
    lr: 0.0001
    weight_decay: 0.01

scheduler:
  class: "CosineAnnealingLR"
  T_max: 40

loss:
  class: "FocalCrossEntropyMix"

nepochs: 40

logging:
  logdir: "./logs_multicanal"
