

data:
  trainpath: '/mounts/datasets/datasets/2025-ZooCamChallenge/train'  
  testpath: '/mounts/datasets/datasets/2025-ZooCamChallenge/test'
  batch_size: 256
  num_workers: 8
  valid_ratio: 0.2
  images_resize: 128

optim:
  algo: AdamW
  params:
    lr: 0.001

nepochs: 2
loss: "CrossEntropyLoss"

logging:
  # wandb: 
  #   project: sample_project
  #   entity: sample_entity
  logdir: "/usr/users/sdim/sdim_23/Desktop/Deep learning/Projet/kaggle_challenge_sdi/logs" 
  results_path: "/usr/users/sdim/sdim_23/Desktop/Deep learning/Projet/kaggle_challenge_sdi/results"
  
scheduler:
  class: "ReduceLROnPlateau"
  mode: "min"        
  factor: 0.7        
  patience: 4
  min_lr: 1.0e-6   


# model:
#   class: Linear
model:
  class: CNN
