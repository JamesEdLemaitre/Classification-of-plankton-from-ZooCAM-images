

data:
  # trainpath: '../data/train'    #car on est dans le TMPDIR normalement
  # testpath: '../data/test' 
  trainpath: '/mounts/datasets/datasets/2025-ZooCamChallenge/train'  
  testpath: '/mounts/datasets/datasets/2025-ZooCamChallenge/test'
  batch_size: 64
  num_workers: 8
  valid_ratio: 0.2
  images_resize: 128
  rgb: true

optim:
  algo: AdamW
  params:
    lr: 0.0001
    weight_decay: 0.01

nepochs: 10
loss: "FocalLoss"
# CrossEntropyLoss

PAS FINIE:
  DSIONDSJGNK

logging:
  # wandb: 
  #   project: sample_project
  #   entity: sample_entity
  logdir: "./logs/RGB/efficientnet_b5_1_60epochs" 
  results_path: "./results/RGBEfficientnetb5/60epochs"
  pretrained_model_path: "./logs/RGB/efficientnet_b5_0/best_model.pt"
  #model_path: "./logs/efficientnet_b5_0/best_model.pt"  
  

scheduler:
  class: "ReduceLROnPlateau"
  mode: "min"        
  factor: 0.7        
  patience: 4
  min_lr: 1.0e-6   


# model:
#   class: Linear
model:
  class: efficientnet_b5