[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchtmpl"
version = "0.0.1"
dependencies = [
    "PyYAML>=6.0",
    "torch>=2.0.1",
    "torchvision>=0.15.2",
    "torchinfo>=1.7.2",
    "wandb>=0.13.11",
    "scipy>=1.10.1",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.1",
    "timm==1.0.22",
    "scikit-learn==1.7.0"
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["torchtmpl"]