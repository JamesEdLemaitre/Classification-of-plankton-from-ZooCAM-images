

data:
  # trainpath: '../data/train'    #car on est dans le TMPDIR normalement
  # testpath: '../data/test' 
  trainpath: '/mounts/datasets/datasets/2025-ZooCamChallenge/train'  
  testpath: '/mounts/datasets/datasets/2025-ZooCamChallenge/test'
  batch_size: 64
  num_workers: 8
  valid_ratio: 0.2
  images_resize: 128
  rgb: true

optim:
  algo: AdamW
  params:
    lr: 0.001

nepochs: 40
loss: "CrossEntropyLoss"
# FocalLoss

logging:
  # wandb: 
  #   project: sample_project
  #   entity: sample_entity
  logdir: "./logs/Cosine/Avectransfo" 
  results_path: "./results/Cosine/Avectransfo"
  #resume_checkpoint: "./logs/ResNet50_0/last_checkpoint.pt"
  ###NE PAS UTILSIER resume_checkpioont et pretrained_model_path à la fois !
  #pretrained_model_path: "./logs/RGB/efficientnet_b5_0/best_model.pt"
  #model_path: "./logs/efficientnet_b5_0/best_model.pt"  
  

scheduler:
  class: "CosineDecayWarmup"

# model:
#   class: Linear
model:
  class: efficientnet_b5