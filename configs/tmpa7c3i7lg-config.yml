

data:
  # trainpath: '../data/train'    #car on est dans le TMPDIR normalement
  # testpath: '../data/test' 
  trainpath: '/mounts/datasets/datasets/2025-ZooCamChallenge/train'  
  testpath: '/mounts/datasets/datasets/2025-ZooCamChallenge/test'
  batch_size: 64
  num_workers: 8
  valid_ratio: 0.2
  images_resize: 128

optim:
  algo: AdamW
  params:
    lr: 0.001

nepochs: 10
loss: "CrossEntropyLoss"
# FocalLoss

logging:
  # wandb: 
  #   project: sample_project
  #   entity: sample_entity
  logdir: "./logs" 
  results_path: "./results"

scheduler:
  class: "ReduceLROnPlateau"
  mode: "min"        
  factor: 0.7        
  patience: 4
  min_lr: 1.0e-6   


# model:
#   class: Linear
model:
  class: efficientnet_b5