data:
  trainpath: './data/train'
  testpath: './data/test'
  batch_size: 256
  num_workers: 8
  valid_ratio: 0.15
  images_resize: 128
  rgb: True

optim:
  algo: AdamW
  params:
    lr: 0.00001

nepochs: 100
loss: "CrossEntropyLoss" # Tester d'autres

logging:
  # wandb: 
  #   project: sample_project
  #   entity: sample_entity
  logdir: "./logs"  # Better to provide the fullpath, especially on the cluster
  results_path: "./results"
  model_path: "./logs/DINOv3Classifier_3/best_model.pt"  # Selection du modèle pour l'inférence sur test

scheduler:
  class: "ReduceLROnPlateau"
  mode: "min"        
  factor: 0.7     
  patience: 3
  min_lr: 1.0e-6   


# model:
#   class: Linear
model:
  class: DINOv3Classifier
  model_size: small_plus
  freeze_backbone: false
  head_hidden_dims: [1024, 512, 256]
  dropout: 0.1

