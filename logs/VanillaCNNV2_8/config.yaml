data:
  batch_size: 1024
  images_resize: 32
  num_workers: 4
  testpath: ./data/3-md-4040-2026-challenge/test
  trainpath: ./data/3-md-4040-2026-challenge/train
  valid_ratio: 0.2
logging:
  logdir: ./logs
loss: CrossEntropyLoss
model:
  class: VanillaCNNV2
  layer1_size: 4
  num_layers: 2
nepochs: 5
optim:
  algo: AdamW
  params:
    lr: 0.01
