data:
  batch_size: 256
  images_resize: 128
  num_workers: 8
  testpath: ./data/test
  trainpath: ./data/train
  valid_ratio: 0.2
logging:
  logdir: ./logs
  model_path: ./logs/VanillaCNNV2_8/best_model.pt
  results_path: ./results
loss: CrossEntropyLoss
model:
  class: VanillaCNNV2
  layer1_size: 32
  num_layers: 4
nepochs: 30
optim:
  algo: AdamW
  params:
    lr: 0.001
scheduler:
  class: ReduceLROnPlateau
  factor: 0.8
  min_lr: 1.0e-06
  mode: min
  patience: 5
