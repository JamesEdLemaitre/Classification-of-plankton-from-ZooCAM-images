data:
  batch_size: 256
  images_resize: 128
  num_workers: 8
  testpath: ./data/test
  trainpath: ./data/train
  valid_ratio: 0.2
logging:
  logdir: ./logs
  results_path: ./results
loss: CrossEntropyLoss
model:
  class: VanillaCNNV2
  layer1_size: 32
  num_layers: 4
nepochs: 20
optim:
  algo: AdamW
  params:
    lr: 0.01
