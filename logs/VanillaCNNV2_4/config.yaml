data:
  batch_size: 256
  images_resize: 64
  num_workers: 4
  testpath: ./data/3-md-4040-2026-challenge/test
  trainpath: ./data/3-md-4040-2026-challenge/train
  valid_ratio: 0.2
logging:
  logdir: ./logs
loss: CrossEntropyLoss
model:
  class: VanillaCNNV2
  layer1_size: 8
  num_layers: 2
nepochs: 20
optim:
  algo: AdamW
  params:
    lr: 0.01
