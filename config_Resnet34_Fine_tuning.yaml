

data:
  # trainpath: '../data/train'    #car on est dans le TMPDIR normalement
  # testpath: '../data/test' 
  trainpath: '/mounts/datasets/datasets/2025-ZooCamChallenge/train'  
  testpath: '/mounts/datasets/datasets/2025-ZooCamChallenge/test'
  batch_size: 256
  num_workers: 8
  valid_ratio: 0.2
  images_resize: 128
  rgb: true

optim:
  algo: AdamW
  params:
    lr: 0.0001
    weight_decay: 0.01

nepochs: 20
loss: "FocalLoss"
# CrossEntropyLoss

logging:
  # wandb: 
  #   project: sample_project
  #   entity: sample_entity
  logdir: "./logs/Resnet34/Coarse/Normalize/finetuning" 
  #resume_checkpoint: "./logs/Resnet34/Coarse/Normalize/ResNet34_0/last_checkpoint.pt"
  results_path: "./results/Resnet34/Coarse/Normalize/finetuning"
  pretrained_model_path: "./logs/Resnet34/Coarse/Normalize/ResNet34_0/best_model.pt" 


scheduler:
  class: "ReduceLROnPlateau"
  mode: "min"        
  factor: 0.7        
  patience: 4
  min_lr: 1.0e-6   


# model:
#   class: Linear
model:
  class: ResNet34